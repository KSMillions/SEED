<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — SEED</title>
    <link rel="stylesheet" href="../css/global.css" />
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 50%, #0F172A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .auth-card {
            background: #FFF;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 48px 40px;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.03em;
            margin-bottom: 32px;
            justify-content: center;
        }

        .auth-title {
            font-size: 26px;
            font-weight: 800;
            color: #0F172A;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #64748B;
            text-align: center;
            margin-bottom: 32px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 13px 20px;
            background: #FFF;
            border: 1.5px solid #E2E8F0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-bottom: 20px;
            text-decoration: none;
        }

        .google-btn:hover {
            background: #F8FAFC;
            border-color: #CBD5E1;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #E2E8F0;
        }

        .divider-text {
            font-size: 12px;
            color: #94A3B8;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .auth-input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #E2E8F0;
            border-radius: 10px;
            font-size: 14px;
            color: #0F172A;
            outline: none;
            transition: all 0.15s ease;
            background: #FFF;
        }

        .auth-input:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .auth-input::placeholder {
            color: #94A3B8;
        }

        .auth-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }

        .auth-submit {
            width: 100%;
            padding: 13px;
            background: #0F172A;
            color: #FFF;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .auth-submit:hover {
            background: #1E293B;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(15, 23, 42, 0.25);
        }

        .auth-footer {
            text-align: center;
            font-size: 13px;
            color: #64748B;
        }

        .auth-footer a {
            color: #3B82F6;
            font-weight: 600;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 12px;
            color: #3B82F6;
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .bg-shapes {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
        }

        .bg-circle-1 {
            width: 400px;
            height: 400px;
            background: rgba(59, 130, 246, 0.08);
            top: -100px;
            right: -100px;
        }

        .bg-circle-2 {
            width: 300px;
            height: 300px;
            background: rgba(99, 102, 241, 0.06);
            bottom: -80px;
            left: -80px;
        }

        .auth-card {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="bg-shapes">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
    </div>

    <div class="auth-card">
        <div class="auth-logo">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                <rect width="28" height="28" rx="6" fill="#0F172A" />
                <rect x="6" y="6" width="4" height="16" rx="2" fill="white" />
                <rect x="13" y="6" width="4" height="16" rx="2" fill="white" opacity="0.5" />
                <rect x="20" y="6" width="2" height="16" rx="1" fill="white" opacity="0.3" />
            </svg>
            seed
        </div>
        <h1 class="auth-title">Welcome back</h1>
        <p class="auth-subtitle">Sign in to your account to continue</p>

        <a href="projects.html" class="google-btn" id="googleBtn">
            <svg width="20" height="20" viewBox="0 0 20 20">
                <path d="M19.6 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.4c-.2 1.2-.9 2.2-2 2.9v2.4h3.2c1.9-1.7 3-4.3 3-7.1z"
                    fill="#4285F4" />
                <path
                    d="M10 20c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H1.1v2.5C2.7 17.7 6.1 20 10 20z"
                    fill="#34A853" />
                <path d="M4.4 12c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V5.5H1.1C.4 6.9 0 8.4 0 10s.4 3.1 1.1 4.5L4.4 12z"
                    fill="#FBBC05" />
                <path
                    d="M10 3.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8C14.9.9 12.6 0 10 0 6.1 0 2.7 2.3 1.1 5.5l3.3 2.5C5.2 5.7 7.4 3.9 10 3.9z"
                    fill="#EA4335" />
            </svg>
            Continue with Google
        </a>

        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-text">or continue with email</span>
            <div class="divider-line"></div>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="auth-label" for="email">Email address</label>
                <input class="auth-input" id="email" type="email" placeholder="you@company.com" value="" />
            </div>
            <div class="form-group">
                <label class="auth-label" for="password">Password</label>
                <input class="auth-input" id="password" type="password" placeholder="Your password" />
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="auth-submit">Sign In →</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="#">Sign up free</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            window.location.href = 'projects.html';
        }
    </script>
</body>

</html>
